forward-task:
  time-converter:
    tls-path: "forward-task/naif0012.tls" # хранит в себе информацию для преобразования utc в et(tdb) и обратно
  space-object-manager:
    bsp-path: "forward-task/de440s.bsp" # хранит в себе x y z vx vy vz
    tpc-path: "forward-task/gm_de440.tpc" # хранит в себе gm разных объектов
    sizes: "forward-task/pck00011.tpc" # радиусы планет
    reference-frame: "J2000"
    aberration-correction: "NONE"
    observer-body: "MERCURY BARYCENTER" #1
  simulation:
    start-date: "2013-01-01 00:00:00.000" #utc
    step: "2000-01-01 11:59:00" # 43 секунды
    end-date: "2015-04-30 19:26:02.000" # конец симмуляции
    caching: 1 # отключение кэширования пока не реализовано(состояния сохраняются в оперативной памяти)
    messenger-color: 255 0 0 # цвет спутника
    au: 149597870.7

render:
  width: 1920
  height: 1080
  background: 0 0 0
  proportion: 1 # делим расстояние между планетами, чтобы все уместилось на экран
  planets-color: 0 255 0 # цвет планет
