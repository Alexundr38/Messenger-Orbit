forward-task:
  time-converter:
    tls-path: "forward-task/naif0012.tls" # хранит в себе информацию для преобразования utc в et(tdb) и обратно
  space-object-manager:
    bsp-path: "forward-task/de442s.bsp" # хранит в себе x y z vx vy vz
    tpc-path: "forward-task/gm_de440.tpc" # хранит в себе gm разных объектов
    sizes: "forward-task/pck00011.tpc" # радиусы планет
    dsn-coords: "forward-task/earth_latest_high_prec.bpc"
    add-dsn-coords: "forward-task/earthstns_itrf93_201023.bsp"
    reference-frame: "J2000"
    aberration-correction: "NONE"
    observer-body: "SSB" #1
  simulation:
    start-date: "2013-01-03 16:18:28 TDB" #utc
    step: "1950-01-01 00:00:01 TDB"
    end-date: "2013-01-03 16:59:38 TDB" # конец симмуляции
    caching: 1 # отключение кэширования пока не реализовано(состояния сохраняются в оперативной памяти)
    messenger-color: 255 0 0 # цвет спутника
    au: 149597870.7

render:
  width: 1920
  height: 1080
  background: 0 0 0
  proportion: 1e-4 # делим расстояние между планетами, чтобы все уместилось на экран
  planets-color: 0 255 0 # цвет планет
